<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Country Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Country Explorer</h1>
      <p class="sub">Search a country and see its flag and key facts.</p>

      <form id="form" class="search">
        <input
          id="query"
          class="input"
          type="text"
          placeholder="e.g. Japan"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="btn" type="submit">Search</button>
      </form>

      <p id="status" class="status" role="status"></p>

      <article id="country" class="country" hidden>
        <img id="flag" class="flag" alt="" />
        <h2 id="name" class="name"></h2>
        <p id="region" class="region"></p>
        <div class="facts">
          <div class="row"><span>Capital</span><strong id="capital"></strong></div>
          <div class="row"><span>Population</span><strong id="population"></strong></div>
          <div class="row"><span>Languages</span><strong id="languages"></strong></div>
          <div class="row"><span>Currencies</span><strong id="currencies"></strong></div>
        </div>
        <a id="map" class="btn ghost" target="_blank" rel="noreferrer">View on the map</a>
      </article>
    </main>

    <script src="app.js"></script>
  </body>
</html>
