<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Countdown Timer</h1>
      <p class="sub">Counting down to your moment, one second at a time.</p>

      <label for="target">Count down to</label>
      <input id="target" class="input" type="datetime-local" />

      <div class="display">
        <div class="unit"><strong id="days">0</strong><span>days</span></div>
        <div class="unit"><strong id="hours">0</strong><span>hours</span></div>
        <div class="unit"><strong id="minutes">0</strong><span>min</span></div>
        <div class="unit"><strong id="seconds">0</strong><span>sec</span></div>
      </div>

      <p id="message" class="message" role="status"></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
