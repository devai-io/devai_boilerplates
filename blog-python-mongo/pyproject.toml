[project]
name = "blog-python-mongo"
version = "0.1.0"
description = "Minimalist blog engine API: FastAPI + PyMongo's async API (MongoDB), argon2 passwords, HS256 JWT auth"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "pyjwt>=2.15.0",
    "pymongo>=4.18.2",
    "uvicorn>=0.54.0",
]
