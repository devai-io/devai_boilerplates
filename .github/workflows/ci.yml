name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in */compose*.yaml; do
            dir=$(dirname "$f") file=$(basename "$f")
            (cd "$dir" && docker compose -f "$file" config -q) || { echo "invalid: $f"; exit 1; }
          done
          echo "all compose files valid"
