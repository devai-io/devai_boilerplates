server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve index.html for any path the router owns.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
