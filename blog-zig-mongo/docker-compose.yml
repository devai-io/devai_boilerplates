services:
  db:
    image: mongo:8
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - mongodata:/data/db

  app:
    build: .
    environment:
      PORT: 8080
      MONGO_URL: mongodb://db:27017
      MONGO_DB: blog
      AUTH_SECRET: change-me
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mongodata:
