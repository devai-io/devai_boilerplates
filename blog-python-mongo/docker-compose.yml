services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      MONGO_URL: mongodb://db:27017
      MONGO_DB: blog
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-not-for-production}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  db:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  mongodata:
