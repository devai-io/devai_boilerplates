[project]
name = "blog-python-mongo"
version = "0.1.0"
description = "Minimalist blog engine API: FastAPI + motor (MongoDB), argon2 passwords, HS256 JWT auth"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "motor>=3.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
]
