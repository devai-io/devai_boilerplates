<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Slideshow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="slideshow" class="card">
      <h1>Image Slideshow</h1>
      <p class="sub">Step through the slides — it also plays on its own.</p>

      <div id="slide" class="slide">
        <span id="slideTitle" class="slide-title"></span>
      </div>

      <div class="controls">
        <button id="prev" class="nav" type="button" aria-label="Previous slide">‹</button>
        <div id="dots" class="dots"></div>
        <button id="next" class="nav" type="button" aria-label="Next slide">›</button>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
