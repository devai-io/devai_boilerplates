services:
  db:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGO_URL: mongodb://db:27017
      MONGO_DB: blog
      AUTH_SECRET: change-me-in-production
    depends_on:
      db:
        condition: service_healthy

volumes:
  mongodata:
