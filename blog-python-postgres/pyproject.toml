[project]
name = "blog-python-postgres"
version = "0.1.0"
description = "Minimalist blog engine API: FastAPI + asyncpg (raw SQL), argon2 passwords, HS256 JWT auth"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "asyncpg>=0.30",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
]
