name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          for f in */compose.yaml; do
            (cd "$(dirname "$f")" && docker compose config -q) || { echo "invalid: $f"; exit 1; }
          done
          echo "all compose files valid"

  # Every folder → its own repo at git.devai.io/templates/<folder> (scripts/publish.sh).
  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/publish.sh
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
