[project]
name = "blog-python-postgres"
version = "0.1.0"
description = "Minimalist blog engine API: FastAPI + asyncpg (raw SQL), argon2 passwords, HS256 JWT auth"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pyjwt>=2.15.0",
    "uvicorn>=0.54.0",
]
